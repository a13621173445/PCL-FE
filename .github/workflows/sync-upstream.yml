name: Sync upstream & Build

# 自动跟随主仓库 PCL-Community/PCL-CE 的 dev 分支：
#   1. git merge 上游 dev（冲突一律保留本仓库的改动）
#   2. 构建单文件 exe
#   3. 构建成功后才把合并结果推回本仓库 dev（坏代码不进分支）
#   4. 刷新 Release: community-latest
#
# 本仓库的全部定制（去更新检查、去正版门槛、去捐赠提示、去用户追踪、
# 去预设主页、去联机功能）都直接体现在源码提交中，不再依赖 patch 文件。

on:
  schedule:
    # 每 6 小时检查一次（UTC）
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Merge upstream dev
        id: merge
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM="https://github.com/PCL-Community/PCL-CE.git"
          git remote add upstream "$UPSTREAM" 2>/dev/null || true
          git fetch --no-tags upstream dev

          if git merge-base --is-ancestor upstream/dev HEAD; then
            echo "本仓库已包含上游 dev，无需合并。"
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "BUILD_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
            exit 0
          fi

          git config user.name "community-bot"
          git config user.email "community-bot@users.noreply.github.com"

          # 全部冲突保留本仓库改动：这里的每一处修改都是有意为之
          git merge --no-edit -X ours upstream/dev || true

          # -X ours 不处理「一方删除文件」的冲突，统一按删除处理：
          # 我们删掉的文件被上游修改 → 保持删除；上游删掉的文件我们改过 → 接受删除
          while IFS= read -r -d '' f; do
            if git cat-file -e "HEAD:$f" 2>/dev/null && git cat-file -e "upstream/dev:$f" 2>/dev/null; then
              git checkout --ours -- "$f"
              git add "$f"
            else
              git rm -q -f --ignore-unmatch "$f"
            fi
          done < <(git diff --name-only --diff-filter=U -z)

          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit --no-edit
          fi

          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "BUILD_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          git log --oneline -5

      - name: Setup .NET SDK
        if: steps.merge.outputs.updated == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # 每次构建注入递增版本号，否则启动器内置更新永远判定「已是最新」。
      # 形如 2.15.1-fe.123：base 跟随上游，suffix 用 run_number 保证单调递增。
      - name: Bump version
        if: steps.merge.outputs.updated == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          path = "Plain Craft Launcher 2/metadata.json"
          with open(path, encoding="utf-8") as f:
              data = json.load(f)
          data["name"] = "Plain Craft Launcher Free Edition"
          data["version"]["suffix"] = "fe." + os.environ["GITHUB_RUN_NUMBER"]
          data["version"]["code"] = int(os.environ["GITHUB_RUN_NUMBER"])
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print(data["version"])
          PY
          BASE=$(python3 -c "import json;print(json.load(open('Plain Craft Launcher 2/metadata.json',encoding='utf-8'))['version']['base'])")
          echo "CE_VERSION=${BASE}-fe.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Publish
        if: steps.merge.outputs.updated == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          dotnet publish "Plain Craft Launcher 2/Plain Craft Launcher 2.csproj" \
            -c Release \
            -p:Platform=x64 \
            -r win-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:PublishTrimmed=false \
            -o ./artifact

      - name: Rename
        if: steps.merge.outputs.updated == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          cp "./artifact/Plain Craft Launcher 2.exe" ./PCL2_CE_Community.exe
          ls -lh ./PCL2_CE_Community.exe

      # 启动器内置的更新源自此文件读取版本号、SHA256 与下载地址
      - name: Generate update.json
        if: steps.merge.outputs.updated == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          SHA256=$(sha256sum ./PCL2_CE_Community.exe | cut -d' ' -f1)
          cat > update.json <<EOF
          {
            "version": "${CE_VERSION}",
            "code": ${GITHUB_RUN_NUMBER},
            "sha256": "${SHA256}",
            "changelog": "自动构建，已同步主仓库最新代码。\\n\\n- 版本：${CE_VERSION}\\n- 提交：${BUILD_SHA}",
            "url": "https://github.com/a13621173445/PCL-FE/releases/download/community-latest/PCL2_CE_Community.exe"
          }
          EOF
          cat update.json

      # 构建通过才推送，避免上游改动导致编译失败时污染 dev 分支
      - name: Push merged dev
        if: steps.merge.outputs.updated == 'true'
        run: git push origin dev

      - name: Publish Release
        if: steps.merge.outputs.updated == 'true' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: community-latest
          name: PCL-FE Build ${{ env.CE_VERSION }}
          prerelease: true
          files: |
            ./PCL2_CE_Community.exe
            ./update.json
          body: |
            由 GitHub Actions 自动构建。

            - 版本：${{ env.CE_VERSION }}
            - 基于主仓库 PCL-Community/PCL-CE 的 dev 分支
            - 已合入本仓库的全部定制改动
            - 提交：${{ env.BUILD_SHA }}

      # 合并或构建失败时开 Issue 提醒，避免自动同步静默中断
      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '自动同步或构建失败，dev 分支保持在上一次可用状态。',
              '',
              `- 运行记录：${runUrl}`,
              `- 触发提交：${context.sha}`,
              '',
              '排查建议：本地执行 `git fetch upstream dev && git merge upstream/dev`，',
              '处理编译错误后推送，下次定时任务会自动继续。'
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-failed'
            });

            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '自动同步失败：需要人工介入',
                body,
                labels: ['sync-failed']
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body
              });
            }
